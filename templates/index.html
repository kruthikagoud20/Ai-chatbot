<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to right, #4a929f, #4b989c);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #3d648e;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f4f7fb;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .message p {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user-message p {
            background: #4c749f;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot-message p {
            background: #e5e5ea;
            color: black;
            border-bottom-left-radius: 5px;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }

        .chat-input button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            background: #5b85b3;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .chat-input button:hover {
            background: #587fa8;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #bbb;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            🤖 AI Chatbot
        </div>

        <div class="chat-box" id="chat"></div>

        <div class="chat-input">
            <input type="text" id="message" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script>

        async function sendMessage() {

            let messageInput = document.getElementById("message");
            let message = messageInput.value.trim();

            if (message === "") return;

            let chatBox = document.getElementById("chat");

            // User Message
            chatBox.innerHTML += `
                <div class="message user-message">
                    <p>${message}</p>
                </div>
            `;

            messageInput.value = "";

            // Fetch response
            let response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            let data = await response.json();

            // Bot Message
            chatBox.innerHTML += `
                <div class="message bot-message">
                    <p>${data.response}</p>
                </div>
            `;

            // Auto scroll
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send message on Enter key
        document.getElementById("message").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

    </script>

</body>

</html>
